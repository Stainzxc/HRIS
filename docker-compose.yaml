services:
  frontend:
    image: node:22
    working_dir: /var/www/frontend
    command: ["sh", "-c", "npm ci --include=dev --include=optional && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/var/www/frontend
      - type: volume
        source: hris_frontend_node_modules
        target: /var/www/frontend/node_modules
        volume:
          nocopy: true

  mysql:
    image: mysql:8.4
    container_name: hris-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hris
      MYSQL_USER: hris
      MYSQL_PASSWORD: hris
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3309:3306"
    volumes:
      - hris_mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: hris-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hris-app
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    ports:
      - "8000:8000"
    depends_on:
      - mysql

volumes:
  hris_frontend_node_modules:
  hris_mysql_data:
